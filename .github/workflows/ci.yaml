name: Java CI with Maven

on:
  push:
    branches:
    - develop
    - main
    paths:
    - src/**
    - pom.xml
    - .github/workflows/ci.yaml
  pull_request:
    branches:
    - develop
    - main
    paths:
    - src/**
    - pom.xml
env:
  MAVEN4_VERSION: '4.0.0-rc-5'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'liberica'
        cache: maven
    - name: Verify
      run: ./mvnw -V --no-transfer-progress clean verify

  test-maven4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'liberica'
        cache: maven
    - name: Download Maven 4
      run: |
        curl -fsSL -o /tmp/apache-maven-${MAVEN4_VERSION}-bin.tar.gz https://dlcdn.apache.org/maven/maven-4/${MAVEN4_VERSION}/binaries/apache-maven-${MAVEN4_VERSION}-bin.tar.gz
        tar xzf /tmp/apache-maven-${MAVEN4_VERSION}-bin.tar.gz -C /tmp
    - name: Verify with Maven 4
      run: ./mvnw -V --no-transfer-progress clean verify -Dmaven4.home=/tmp/apache-maven-${MAVEN4_VERSION}

  deploy:
    needs: [test, test-maven4]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@v3.4.0
      with:
        exportToken: true
        method: jwt
        url: ${{ secrets.VAULT_ADDR }}
        role: cicd
        secrets: |
          kv/data/cicd/maven_central username | MAVEN_CENTRAL_USERNAME ;
          kv/data/cicd/maven_central password | MAVEN_CENTRAL_PASSWORD ;
          kv/data/cicd/gpg secring | GPG_SECRING ;
          kv/data/cicd/gpg passphrase | GPG_PASSPHRASE ;
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
        gpg-private-key: ${{ steps.secrets.outputs.GPG_SECRING }}
        gpg-passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
    - name: Generates Maven Settings
      uses: s4u/maven-settings-action@v4.0.0
      with:
        servers: |
          [{
              "id": "central",
              "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_USERNAME }}",
              "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_PASSWORD }}"
          }]
    - name: Deploy to Maven Central
      run: |
        set -e
        mvn -V \
            javadoc:jar \
            source:jar \
            package \
            org.apache.maven.plugins:maven-gpg-plugin:3.0.1:sign \
            deploy \
            --no-transfer-progress \
            -Dgpg.passphrase=${GPG_PASSPHRASE} \
            -DskipTests=true
    - name: Revoke token
      if: always()
      run: |
        curl -X POST -s -H "X-Vault-Token: ${VAULT_TOKEN}" ${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self || true
